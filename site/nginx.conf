# Fonts and release files never change under the same name; CSS, JS, images and icons change with a deploy; the
# release list is cached below; the page, robots.txt and the sitemap are always revalidated.
map $uri $cache_control {
    ~^/fonts/                       "public, max-age=31536000, immutable";
    ~^/download/                    $download_cache;
    ~\.(css|js|png|svg|webp|ico)$   "public, max-age=3600";
    /releases.json                  "public, max-age=600";
    default                         "no-cache";
}
# Only a file that arrived is kept: a 404 for a release that doesn't exist yet must not be cached for a year.
map $status $download_cache {
    200                             "public, max-age=31536000, immutable";
    default                         "no-store";
}
# Release files (/download/...) are saved under their own name, not opened; an error page isn't. Empty, so not
# sent, everywhere else.
map "$status $uri" $content_disposition {
    "~^20[06] /download/[^/]+/(?<download_file>[^/]+)$"   "attachment; filename=\"$download_file\"";
    default                                                "";
}

# The "Hosted version: get notified" sign-up: POST /notify runs njs/notify.js (the module is loaded in nginx.conf
# by the Dockerfile), which keeps the address on the /data/signups volume. See site/README.md.
js_path "/etc/nginx/njs/";
js_import notify from notify.js;

# Who is signing up, for the rate limit only (the address is never stored). The container is reachable only
# through Dokploy's Traefik, which puts the address it was connected from last in X-Forwarded-For; only that last
# entry is believed, not anything a visitor sends. When it is a Cloudflare edge, the visitor is in CF-Connecting-IP;
# from anywhere else that header is ignored, so going around Cloudflare doesn't let anyone choose their own key.
# Cloudflare's ranges are from https://www.cloudflare.com/ips/ (checked 2026-11-03; they rarely change).
map $http_x_forwarded_for $notify_peer {
    "~(?<last_hop>[^,\s]+)\s*$"     $last_hop;
    default                         $remote_addr;
}
geo $notify_peer $notify_via_cloudflare {
    default             0;
    173.245.48.0/20     1;
    103.21.244.0/22     1;
    103.22.200.0/22     1;
    103.31.4.0/22       1;
    141.101.64.0/18     1;
    108.162.192.0/18    1;
    190.93.240.0/20     1;
    188.114.96.0/20     1;
    197.234.240.0/22    1;
    198.41.128.0/17     1;
    162.158.0.0/15      1;
    104.16.0.0/13       1;
    104.24.0.0/14       1;
    172.64.0.0/13       1;
    131.0.72.0/22       1;
    2400:cb00::/32      1;
    2606:4700::/32      1;
    2803:f800::/32      1;
    2405:b500::/32      1;
    2405:8100::/32      1;
    2a06:98c0::/29      1;
    2c0f:f248::/32      1;
}
map "$notify_via_cloudflare:$http_cf_connecting_ip" $notify_client {
    "~^1:(?<cf_client>.+)$"         $cf_client;
    default                         $notify_peer;
}
# 5 a minute per visitor, with a burst of 3 for a typo or two.
limit_req_zone $notify_client zone=notify:1m rate=5r/m;

# GitHub allows 60 unauthenticated API calls an hour per IP, which visitors on a shared IP would run out of.
# So the server asks once every 10 minutes and every visitor gets the cached answer.
proxy_cache_path /var/cache/nginx/releases keys_zone=releases:1m max_size=10m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/x-icon text/xml text/plain;

    # One set of headers for every response (a location with its own add_header would drop these).
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Content-Disposition $content_disposition always;

    location = /releases.json {
        # The container's own DNS servers, filled in at start by the nginx image (NGINX_ENTRYPOINT_LOCAL_RESOLVERS),
        # looked up per request so a change in GitHub's addresses is picked up.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $github api.github.com;
        proxy_pass https://$github/repos/DynamicsNinja/privatepaste/releases?per_page=30;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header Accept application/vnd.github+json;
        proxy_set_header User-Agent privatepaste-site;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache releases;
        proxy_cache_key releases;
        proxy_cache_valid 200 10m;
        # When GitHub is down or rate-limits us, keep serving the last good list.
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
    }

    # The download buttons: this repository's release files, served from this site so a phone downloads them
    # without leaving the page (a cross-origin link ignores the download attribute and opens GitHub first). Only a
    # desktop, Android or extension release tag and a PrivatePaste file name are accepted, so this is no open
    # proxy. GitHub
    # answers with a redirect to its file storage, which @release_file follows here instead of the browser.
    location ~ "^/download/(?<release_tag>(?:desktop|android|extension)-v[0-9][0-9A-Za-z.\-]*)/(?<release_file>(?:PrivatePaste|privatepaste-extension)-[0-9A-Za-z.\-]+\.(?:msi|zip|tar\.gz|apk))$" {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $github github.com;
        proxy_pass https://$github/DynamicsNinja/privatepaste/releases/download/$release_tag/$release_file;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header User-Agent privatepaste-site;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @release_file;
    }

    location @release_file {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        # Saved first: proxying again replaces the upstream variables.
        set $release_location $upstream_http_location;
        # Follow GitHub's own storage hosts only.
        if ($release_location !~ "^https://(?:release-assets|objects)\.githubusercontent\.com/") {
            return 502;
        }
        proxy_pass $release_location;
        proxy_ssl_server_name on;
        proxy_set_header User-Agent privatepaste-site;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        # Stream large files straight through instead of buffering them on disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        # Content-Type, Content-Length and ranges pass through; these come from this server instead.
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }

    # The sign-up form. Not logged (the access log would keep the visitor's address), and rate-limit refusals are
    # logged below the error log's level for the same reason. The whole body stays in memory for njs. Redirects are
    # relative, so they keep the visitor's https:// (TLS ends at Traefik).
    location = /notify {
        access_log off;
        absolute_redirect off;
        client_max_body_size 4k;
        client_body_buffer_size 4k;
        limit_req zone=notify burst=3 nodelay;
        limit_req_status 429;
        limit_req_log_level info;
        error_page 429 = @notify_limited;
        js_content notify.submit;
    }

    location @notify_limited {
        access_log off;
        absolute_redirect off;
        js_content notify.limited;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
