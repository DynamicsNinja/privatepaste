# Fonts and release files never change under the same name; CSS, JS, images and icons change with a deploy; the
# release list is cached below; the page, robots.txt and the sitemap are always revalidated.
map $uri $cache_control {
    ~^/fonts/                       "public, max-age=31536000, immutable";
    ~^/download/                    $download_cache;
    ~\.(css|js|png|svg|webp|ico)$   "public, max-age=3600";
    /releases.json                  "public, max-age=600";
    default                         "no-cache";
}
# Only a file that arrived is kept: a 404 for a release that doesn't exist yet must not be cached for a year.
map $status $download_cache {
    200                             "public, max-age=31536000, immutable";
    default                         "no-store";
}
# Release files (/download/...) are saved under their own name, not opened; an error page isn't. Empty, so not
# sent, everywhere else.
map "$status $uri" $content_disposition {
    "~^20[06] /download/[^/]+/(?<download_file>[^/]+)$"   "attachment; filename=\"$download_file\"";
    default                                                "";
}

# GitHub allows 60 unauthenticated API calls an hour per IP, which visitors on a shared IP would run out of.
# So the server asks once every 10 minutes and every visitor gets the cached answer.
proxy_cache_path /var/cache/nginx/releases keys_zone=releases:1m max_size=10m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml image/x-icon text/xml text/plain;

    # One set of headers for every response (a location with its own add_header would drop these).
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Content-Disposition $content_disposition always;

    location = /releases.json {
        # The container's own DNS servers, filled in at start by the nginx image (NGINX_ENTRYPOINT_LOCAL_RESOLVERS),
        # looked up per request so a change in GitHub's addresses is picked up.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $github api.github.com;
        proxy_pass https://$github/repos/DynamicsNinja/privatepaste/releases?per_page=30;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header Accept application/vnd.github+json;
        proxy_set_header User-Agent privatepaste-site;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache releases;
        proxy_cache_key releases;
        proxy_cache_valid 200 10m;
        # When GitHub is down or rate-limits us, keep serving the last good list.
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
    }

    # The download buttons: this repository's release files, served from this site so a phone downloads them
    # without leaving the page (a cross-origin link ignores the download attribute and opens GitHub first). Only a
    # desktop or Android release tag and a PrivatePaste file name are accepted, so this is no open proxy. GitHub
    # answers with a redirect to its file storage, which @release_file follows here instead of the browser.
    location ~ "^/download/(?<release_tag>(?:desktop|android)-v[0-9][0-9A-Za-z.\-]*)/(?<release_file>PrivatePaste-[0-9A-Za-z.\-]+\.(?:msi|zip|tar\.gz|apk))$" {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $github github.com;
        proxy_pass https://$github/DynamicsNinja/privatepaste/releases/download/$release_tag/$release_file;
        proxy_ssl_server_name on;
        proxy_set_header Host github.com;
        proxy_set_header User-Agent privatepaste-site;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @release_file;
    }

    location @release_file {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        # Saved first: proxying again replaces the upstream variables.
        set $release_location $upstream_http_location;
        # Follow GitHub's own storage hosts only.
        if ($release_location !~ "^https://(?:release-assets|objects)\.githubusercontent\.com/") {
            return 502;
        }
        proxy_pass $release_location;
        proxy_ssl_server_name on;
        proxy_set_header User-Agent privatepaste-site;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        # Stream large files straight through instead of buffering them on disk.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        # Content-Type, Content-Length and ranges pass through; these come from this server instead.
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
