# Fonts never change under the same name; CSS, JS and images change with a deploy; the release list is cached
# below; the page is always revalidated.
map $uri $cache_control {
    ~^/fonts/              "public, max-age=31536000, immutable";
    ~\.(css|js|png|svg)$   "public, max-age=3600";
    /releases.json         "public, max-age=600";
    default                "no-cache";
}

# GitHub allows 60 unauthenticated API calls an hour per IP, which visitors on a shared IP would run out of.
# So the server asks once every 10 minutes and every visitor gets the cached answer.
proxy_cache_path /var/cache/nginx/releases keys_zone=releases:1m max_size=10m inactive=7d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # One set of headers for every response (a location with its own add_header would drop these).
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location = /releases.json {
        # The container's own DNS servers, filled in at start by the nginx image (NGINX_ENTRYPOINT_LOCAL_RESOLVERS),
        # looked up per request so a change in GitHub's addresses is picked up.
        resolver ${NGINX_LOCAL_RESOLVERS} valid=300s ipv6=off;
        set $github api.github.com;
        proxy_pass https://$github/repos/DynamicsNinja/privatepaste/releases?per_page=30;
        proxy_ssl_server_name on;
        proxy_set_header Host api.github.com;
        proxy_set_header Accept application/vnd.github+json;
        proxy_set_header User-Agent privatepaste-site;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        proxy_cache releases;
        proxy_cache_key releases;
        proxy_cache_valid 200 10m;
        # When GitHub is down or rate-limits us, keep serving the last good list.
        proxy_cache_use_stale error timeout updating http_403 http_429 http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
