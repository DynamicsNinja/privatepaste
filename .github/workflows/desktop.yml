name: desktop

on:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        id: publish
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG -replace '^desktop-v', ''
          "version=$version" >> $env:GITHUB_OUTPUT
          ./scripts/publish-windows.ps1 -Version $version

      # Code signing through SignPath (see .signpath/). Off until the repository variable SIGNPATH_ORGANIZATION_ID
      # is set; until then the release is built unsigned (README "Code signing").
      # Each signing request waits for a manual approval in SignPath.
      - name: Upload the unsigned exe
        id: unsigned-exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: artifacts/win-x64/PrivatePaste.exe
          if-no-files-found: error
      - name: Sign the exe
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          # Approval is manual, so allow time to approve.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/win-x64
          parameters: |
            version: ${{ toJSON(steps.publish.outputs.version) }}

      - name: Zip and build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.publish.outputs.version }}
        run: |
          # Zipped again here so the zip holds the signed exe when signing is on.
          $zip = "artifacts/PrivatePaste-$env:VERSION-win-x64.zip"
          Compress-Archive -Path artifacts/win-x64/PrivatePaste.exe -DestinationPath $zip -CompressionLevel Optimal -Force
          Remove-Item artifacts/PrivatePaste-win-x64.zip -ErrorAction SilentlyContinue
          ./scripts/build-installer.ps1 -Version $env:VERSION -NoPublish
          foreach ($f in $zip, "artifacts/PrivatePaste-$env:VERSION-win-x64.msi") {
            if (-not (Test-Path $f)) { throw "$f is missing" }
          }

      - name: Upload the unsigned installer
        id: unsigned-msi
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-msi
          path: artifacts/PrivatePaste-*-win-x64.msi
          if-no-files-found: error
      - name: Sign the installer
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: msi
          github-artifact-id: ${{ steps.unsigned-msi.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            artifacts/PrivatePaste-*-win-x64.zip
            artifacts/PrivatePaste-*-win-x64.msi
          if-no-files-found: error

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}" ./scripts/publish-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/macos/PrivatePaste-*.zip
          if-no-files-found: error

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: |
          VERSION="${GITHUB_REF_NAME#desktop-v}" ./scripts/publish-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/linux/PrivatePaste-*.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#desktop-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            flags=""
            case "$version" in *-*) flags="--prerelease" ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* --title "PrivatePaste $version" --generate-notes $flags
          fi
