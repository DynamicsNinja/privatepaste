<!doctype html>
<!--
  The homepage's social card (Open Graph / Twitter image), 1200x630. scripts/make-site-images.py screenshots #card
  through make-og-card.mjs and saves site/images/og-card.png. Night vault colors from DESIGN.md; the wordmark is
  branding/lockup-on-dark.svg (outlined, no font needed); the tagline uses the web app's Sora font.
-->
<html>
<head>
<meta charset="utf-8">
<title>Social card</title>
<style>
  @font-face { font-family: "Sora"; src: url("../../src/PrivatePaste.Server/wwwroot/fonts/sora-latin.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; padding: 0; background: #000; }
  #card {
    width: 1200px; height: 630px; position: relative; overflow: hidden; box-sizing: border-box; padding: 0 96px;
    display: flex; flex-direction: column; justify-content: center; gap: 40px;
    background: radial-gradient(760px 520px at 78% 30%, rgba(183, 165, 255, .22), rgba(183, 165, 255, 0) 70%), #15122B;
    font-family: "Sora", sans-serif; color: #E9E6F7;
  }
  #card img { width: 495px; height: 96px; display: block; }
  h1 { margin: 0; font-size: 58px; line-height: 1.14; letter-spacing: -1px; font-weight: 600; }
  p { margin: 0; font-size: 26px; color: #9A94BD; }
  p b { color: #B7A5FF; font-weight: 600; }
</style>
</head>
<body>
<div id="card">
  <img src="../../branding/lockup-on-dark.svg" alt="">
  <h1>Your clipboard on every device,<br>kept on your own server.</h1>
  <p><b>Self-hosted clipboard sync</b> · Windows, macOS, Linux, Android and web</p>
</div>
</body>
</html>
