<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PrivatePaste</title>
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <!-- Filled in by popup.js from the engine's answers; clip content only ever goes in through textContent. -->
  <header class="top">
    <img class="logo" src="icons/logo.svg" alt="">
    <span class="wordmark">private<span>paste</span></span>
    <span class="status" id="status" hidden><span class="dot"></span><span id="status-text"></span></span>
    <button type="button" class="icon-button ghost" id="open-settings" aria-label="Settings" title="Settings" hidden>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button type="button" class="icon-button ghost" id="close-settings" aria-label="Back to history" title="Back to history" hidden>
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
  </header>

  <main>
    <section id="view-signin" hidden>
      <h1>Sign in</h1>
      <p class="muted lead">Connect this browser to your PrivatePaste server.</p>
      <form id="signin-form" class="stack">
        <p class="error" id="signin-error" role="alert" hidden></p>
        <label for="server">Server URL</label>
        <input type="url" id="server" placeholder="https://paste.example.com" autocomplete="url" required>
        <label for="username">Name</label>
        <input type="text" id="username" maxlength="32" autocomplete="username" required>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <label for="device-name">Device name</label>
        <input type="text" id="device-name" maxlength="50" value="Edge">
        <button type="submit" class="primary">Sign in</button>
      </form>
    </section>

    <section id="view-unlock" hidden>
      <h1>Unlock your history</h1>
      <p class="muted lead" id="unlock-message" hidden></p>
      <form id="unlock-form" class="stack">
        <p class="error" id="unlock-error" role="alert" hidden></p>
        <label for="passphrase">Passphrase</label>
        <input type="password" id="passphrase" autocomplete="off" required>
        <button type="submit" class="primary">Unlock</button>
      </form>
      <button type="button" class="link sign-out">Sign out</button>
    </section>

    <section id="view-novault" hidden>
      <p class="muted empty" id="novault-message"></p>
      <button type="button" class="link sign-out">Sign out</button>
    </section>

    <section id="view-history" hidden>
      <p class="notice" id="notice" role="status" hidden></p>
      <label class="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"/></svg>
        <input type="search" id="search" placeholder="Search history" aria-label="Search history">
      </label>
      <div class="tabs" role="tablist" aria-label="History views">
        <button type="button" class="tab" role="tab" data-tab="history" aria-selected="true">History</button>
        <button type="button" class="tab" role="tab" data-tab="pinned" aria-selected="false">Pinned</button>
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filter by type">
        <button type="button" class="chip" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-filter="text" aria-pressed="false"><span class="chip-icon"></span>Text</button>
        <button type="button" class="chip" data-filter="link" aria-pressed="false"><span class="chip-icon"></span>Links</button>
        <button type="button" class="chip" data-filter="image" aria-pressed="false"><span class="chip-icon"></span>Images</button>
        <button type="button" class="chip" data-filter="file" aria-pressed="false"><span class="chip-icon"></span>Files</button>
      </div>
      <p class="error" id="history-error" role="alert" hidden></p>
      <div class="scroller" id="scroller">
        <ul class="clips" id="clips"></ul>
        <p class="muted empty" id="empty" hidden></p>
        <div class="list-footer">
          <button type="button" id="load-more" hidden>Load more</button>
          <button type="button" id="search-older" hidden>Search older clips</button>
        </div>
      </div>
    </section>

    <section id="view-settings" hidden>
      <h1>Settings</h1>
      <div class="panel">
        <div class="setting"><span class="label">Server</span><span class="value" id="settings-server"></span></div>
        <div class="setting"><span class="label">Device name</span><span class="value" id="settings-device"></span></div>
      </div>
      <div class="panel">
        <label class="switch-row" for="pause">
          <span class="label">Pause syncing</span>
          <input type="checkbox" role="switch" id="pause">
        </label>
        <p class="hint muted">Nothing is sent or received while paused.</p>
        <p class="hint muted note">Copies from password managers sync too: the extension can't tell them apart.</p>
      </div>
      <p class="error" id="settings-error" role="alert" hidden></p>
      <button type="button" class="danger" id="sign-out">Sign out</button>
    </section>
  </main>

  <template id="clip-row">
    <li class="clip">
      <span class="kind"></span>
      <div class="body"><span class="title"></span><span class="meta"></span></div>
      <button type="button" class="act icon-button"></button>
    </li>
  </template>
  <template id="file-line">
    <li class="file-line"><span class="file-name"></span><span class="file-size muted"></span><button type="button" class="icon-button ghost file-download"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></button></li>
  </template>
  <template id="action-icons">
    <svg data-icon="copy" class="btn-icon idle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 9h10a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V10a1 1 0 0 1 1-1zM5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
    <svg data-icon="check" class="btn-icon done-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    <svg data-icon="download" class="btn-icon idle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>
    <svg data-icon="pin" class="pin-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg>
  </template>
  <template id="kind-icons">
    <svg data-kind="image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>
    <svg data-kind="link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
    <svg data-kind="file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z M14 3v5h5"/></svg>
    <svg data-kind="text" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
  </template>
  <!-- branding/platform-icons, as on the web history page (Pages/PlatformIcons.cs). -->
  <template id="platform-icons">
    <svg class="platform" data-platform="windows" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Windows"><title>Windows</title><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
    <svg class="platform" data-platform="macos" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="macOS"><title>macOS</title><path d="M9 9h6v6H9zM9 9V6a3 3 0 1 0-3 3h3M15 9V6a3 3 0 1 1 3 3h-3M15 15v3a3 3 0 1 0 3-3h-3M9 15v3a3 3 0 1 1-3-3h3"/></svg>
    <svg class="platform" data-platform="linux" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Linux"><title>Linux</title><path d="M4 6l6 6-6 6M12 18h8"/></svg>
    <svg class="platform" data-platform="android" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Android"><title>Android</title><path d="M3 18.5a9 9 0 0 1 18 0zM7.5 10.7 5.5 7.2M16.5 10.7 18.5 7.2M8.5 14.5h.01M15.5 14.5h.01"/></svg>
    <svg class="platform" data-platform="web" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Web"><title>Web</title><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0zM3 12h18M12 3c-2.5 2.4-3.8 5.4-3.8 9s1.3 6.6 3.8 9M12 3c2.5 2.4 3.8 5.4 3.8 9s-1.3 6.6-3.8 9"/></svg>
    <svg class="platform" data-platform="extension" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Browser extension"><title>Browser extension</title><path d="M4 8h4.5a2.5 2.5 0 1 1 5 0H18v4.5a2.5 2.5 0 1 1 0 5V20H4z"/></svg>
    <svg class="platform" data-platform="unknown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Unknown device"><title>Unknown device</title><path d="M5 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM12 16v4M8 20h8"/></svg>
  </template>
</body>
</html>
